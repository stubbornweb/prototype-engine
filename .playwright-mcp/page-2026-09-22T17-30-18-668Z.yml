  - generic [ref=f2e280]:
    - generic [ref=f2e281]:
      - generic [ref=f2e282]: How working together goes
      - heading "No black boxes. Four steps, all visible." [level=2] [ref=f2e285]
      - paragraph [ref=f2e286]: The fastest way to lose trust is to disappear for three weeks. This is the rhythm I hold to, on every engagement, regardless of size.
    - list [ref=f2e289]:
      - listitem [ref=f2e290]:
        - generic [ref=f2e291]: "01"
        - heading "A call, not a pitch" [level=3] [ref=f2e292]
        - paragraph [ref=f2e293]: Thirty minutes. You describe the problem, I ask the annoying questions. If I'm not the right person you'll hear that on the call, with a suggestion of who is.
      - listitem [ref=f2e294]:
        - generic [ref=f2e295]: "02"
        - heading "A written plan with a number on it" [level=3] [ref=f2e296]
        - paragraph [ref=f2e297]: Scope, sequence, risks, and a fixed price or a clear rate. You get it in writing before anything is committed. No hourly surprises.
      - listitem [ref=f2e298]:
        - generic [ref=f2e299]: "03"
        - heading "Weekly working software" [level=3] [ref=f2e300]
        - paragraph [ref=f2e301]: Every week there is something running on a URL you can open. Progress is visible, not reported. If priorities change, we change them in the open.
      - listitem [ref=f2e302]:
        - generic [ref=f2e303]: "04"
        - heading "Handover you could survive without me" [level=3] [ref=f2e304]
        - paragraph [ref=f2e305]: Documented, tested, deployed under your accounts. A walkthrough recording for the team. You are never hostage to the person who built it.
